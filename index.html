 Check`,prompt:`In the reaction 3H⁺ + M(OH)₃(s) + 2CaC₂O₄(s) → M(C₂O₄)₂⁻(aq) + 2Ca²⁺(aq) + 3H₂O, what does "M" represent?`,options:[`Aluminum (Al) or Iron (Fe)`,`Mercury (Hg) or Lead (Pb)`,`Sodium (Na) or Potassium (K)`,`Sulfur (S) or Boron (B)`],correctIndex:0,answerSummary:`Aluminum (Al) or Iron (Fe)`,explanation:`Soil fungi produce oxalate ions (C₂O₄²⁻) that complex with Iron (Fe) or Aluminum (Al) in minerals, speeding up weathering.`},{id:`s2-humus-solution`,title:`Challenge 6 · Humus & Soil Solution Classifier`,mechanic:`Solubility Diagnostic`,prompt:`Which statement accurately describes the three components of Soil Humus and Soil Solution?`,options:[`Humic acids dissolve in base only; Fulvic acids stay soluble in acid; Humin is insoluble; Soil solution transports dissolved cations & anions`,`Humin dissolves easily in acid rain; Fulvic acids are solid bedrock; Soil solution only contains sand particles`,`Humic acids only exist in topsoil rocks; Soil solution blocks all Ca²⁺ and HCO₃⁻ movement`,`Fats, resins, and waxes dissolve in pure water faster than saccharides`],correctIndex:0,answerSummary:`Humic acids = base-soluble; Fulvic acids = acid-soluble; Humin = insoluble residue; Soil solution = water portion transporting ions`,explanation:`Humic acids precipitate in acidic conditions, fulvic acids remain soluble in acid, humin is insoluble residue, and soil solution transports dissolved nutrients.`}],Ae=[{id:`s3-clay-sites`,title:`Challenge 5 · Clay Colloid & Cation Exchange`,mechanic:`Ion Exchange Equation`,prompt:`In {Soil}Ca²⁺ + 2CO₂ + 2H₂O → {Soil}(H⁺)₂ + Ca²⁺(root) + 2HCO₃⁻, why do clay minerals adsorb cations like Ca²⁺, K⁺, Mg²⁺, and NH₄⁺?`,options:[`Clay minerals act as negatively charged sites attracting positively charged cations`,`Clay minerals carry strong positive charges that repel Ca²⁺ and attract Cl⁻`,`Carbonic acid freezes water inside the roots so H⁺ cannot leave`,`Roots release metal cations in exchange for absorbing pure methane gas`],correctI
